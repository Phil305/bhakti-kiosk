<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Columbia Bhakti-Yoga Kiosk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  :root {
    --ground: #fafaf8;
    --panel: #ffffff;
    --ink: #1e1b4b;
    --ink-soft: #5b5880;
    --line: #dedcea;
    --accent: #d99a00;
    --accent-ink: #1e1b4b;
    --overlay: rgba(30, 27, 75, 0.92);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15132b;
      --panel: #1f1c3d;
      --ink: #eceaf7;
      --ink-soft: #a5a2c4;
      --line: #35325a;
      --accent: #f2b600;
      --accent-ink: #15132b;
      --overlay: rgba(21, 19, 43, 0.94);
    }
  }
  :root[data-theme="dark"] {
    --ground: #15132b;
    --panel: #1f1c3d;
    --ink: #eceaf7;
    --ink-soft: #a5a2c4;
    --line: #35325a;
    --accent: #f2b600;
    --accent-ink: #15132b;
    --overlay: rgba(21, 19, 43, 0.94);
  }

  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .qr {
    width: 84px;
    height: 84px;
    flex: none;
    background: #fff;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .qr img { display: block; width: 100%; height: 100%; }
  .words { flex: 1; min-width: 0; }
  h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hint {
    margin: 4px 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    line-height: 1.35;
  }
  .hint b { color: var(--ink); font-weight: 700; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    flex: none;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; min-height: 0; position: relative; }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
  }

  .thanks {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 10px;
  }
  .thanks .mark {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 2rem; font-weight: 800;
    margin-bottom: 8px;
  }
  .thanks h2 { margin: 0; font-size: 1.6rem; font-weight: 800; text-wrap: balance; }
  .thanks p { margin: 0; opacity: 0.8; font-size: 0.95rem; }
  .thanks p span { font-variant-numeric: tabular-nums; font-weight: 700; }

  @media (min-width: 760px) {
    body { flex-direction: row; }
    header {
      flex-direction: column;
      align-items: stretch;
      width: 300px;
      border-bottom: 0;
      border-right: 1px solid var(--line);
      padding: 28px 24px;
      gap: 20px;
    }
    .qr { width: 100%; height: auto; aspect-ratio: 1; padding: 10px; }
    h1 { font-size: 1.4rem; }
    .hint { font-size: 0.95rem; margin-top: 8px; }
    button { align-self: flex-start; margin-top: auto; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .thanks { animation: fade 240ms ease-out; }
    @keyframes fade { from { opacity: 0; } }
  }
</style>
</head>

  <button id="reset" type="button">Reset</button>
</header>

<main>
  <iframe id="form" src="https://tally.so/embed/2E01R9?hideTitle=1" title="Columbia Bhakti-Yoga Interest Form"></iframe>
  <div class="thanks" id="thanks" hidden>
    <div class="mark">✓</div>
    <h2>Thank you — we'll be in touch.</h2>
    <p>Ready for the next person in <span id="count">5</span>s</p>
  </div>
</main>

<script>
  const FORM_SRC = "https://tally.so/embed/2E01R9?hideTitle=1";
  const frame = document.getElementById("form");
  const thanks = document.getElementById("thanks");
  const count = document.getElementById("count");
  let timer = null;

  function reset() {
    clearInterval(timer);
    thanks.hidden = true;
    frame.src = FORM_SRC + "&t=" + Date.now();
  }

  function submitted() {
    let n = 5;
    count.textContent = n;
    thanks.hidden = false;
    clearInterval(timer);
    timer = setInterval(() => {
      n -= 1;
      count.textContent = n;
      if (n <= 0) reset();
    }, 1000);
  }

  window.addEventListener("message", (e) => {
    if (typeof e.data === "string" && e.data.includes("Tally.FormSubmitted")) submitted();
  });
  document.getElementById("reset").addEventListener("click", reset);
  thanks.addEventListener("click", reset);
</script>
</body>
</html>
